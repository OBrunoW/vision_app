publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  wakelock_plus: ^1.1.4
